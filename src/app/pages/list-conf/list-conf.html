<input type="text" name="serach"
       class="form-control"
       placeholder="search by title "
       [(ngModel)]="searchTitle">

<div class="conf-grid">
  @for (confe of list; track $index) {
    @if (searchTitle == '' || confe.title.toLowerCase().includes(searchTitle.toLowerCase())) {

      <div class="conf-card">
        <ul class="list-group">
          <li class="list-group-item active" aria-current="true">
            <img [src]="confe.picture" alt="" width="80">
          </li>
          <li class="list-group-item">{{ confe.title }}</li>
          <li class="list-group-item">{{ confe.date }}</li>
          <li class="list-group-item">{{ confe.description }}</li>
          <li class="list-group-item">{{ confe.nbrMax - confe.nbrReservation }}</li>
        </ul>

        <button class="btn btn-success participate-btn"
                [disabled]="confe.nbrMax == confe.nbrReservation"
                (click)="participate(confe)">
          participate
        </button>
      </div>

    }
  }
</div>
